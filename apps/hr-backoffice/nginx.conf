server {
    listen 80;
    root /usr/share/nginx/html;

    # SPA: 알 수 없는 경로는 index.html로 돌려줌 (클라이언트 라우팅)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 빌드 파일은 이름에 해시가 있으므로 오래 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
