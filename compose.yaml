# PMart 직원 IAM 검증 환경
# 실행: docker compose up -d --build
# 외부(호스트)에 공개하는 포트는 Gateway(8080)와 인사팀 백오피스(3000)뿐입니다.
# Keycloak, PostgreSQL, 각 Spring Boot 서비스는 내부 네트워크에서만 접근합니다.

name: pmart-iam

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      EMPLOYEE_DB_PASSWORD: ${EMPLOYEE_DB_PASSWORD}
      EMPLOYEE_AUTH_DB_PASSWORD: ${EMPLOYEE_AUTH_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Gateway 뒷단: 브라우저가 보는 주소는 Gateway의 /iam
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /iam
      KC_HOSTNAME: ${PUBLIC_BASE_URL}/iam
      # 서버 간 호출(http://keycloak:8080/iam)은 내부 주소 그대로 응답
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Realm JSON의 ${...} 자리표시자에 들어갈 값
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      BACKOFFICE_ORIGIN: ${BACKOFFICE_ORIGIN}
      EMPLOYEE_AUTH_CLIENT_SECRET: ${EMPLOYEE_AUTH_CLIENT_SECRET}
      EMPLOYEE_AUTH_BOOTSTRAP_CLIENT_SECRET: ${EMPLOYEE_AUTH_BOOTSTRAP_CLIENT_SECRET}
      EMPLOYEE_SERVICE_CLIENT_SECRET: ${EMPLOYEE_SERVICE_CLIENT_SECRET}
    volumes:
      - ./infra/keycloak/import:/opt/keycloak/data/import:ro
    # ports 없음: Keycloak은 Gateway 뒷단에 두며 외부에 공개하지 않음
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /iam/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  employee-service:
    build: ./services/employee-service
    environment:
      EMPLOYEE_DB_PASSWORD: ${EMPLOYEE_DB_PASSWORD}
      EMPLOYEE_SERVICE_CLIENT_SECRET: ${EMPLOYEE_SERVICE_CLIENT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck: &spring-health
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 20s

  employee-auth:
    build: ./services/employee-auth
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      BACKOFFICE_ORIGIN: ${BACKOFFICE_ORIGIN}
      EMPLOYEE_AUTH_DB_PASSWORD: ${EMPLOYEE_AUTH_DB_PASSWORD}
      EMPLOYEE_AUTH_CLIENT_SECRET: ${EMPLOYEE_AUTH_CLIENT_SECRET}
      EMPLOYEE_AUTH_BOOTSTRAP_CLIENT_SECRET: ${EMPLOYEE_AUTH_BOOTSTRAP_CLIENT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      HR_TEST_USERNAME: ${HR_TEST_USERNAME}
      HR_TEST_PASSWORD: ${HR_TEST_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      employee-service:
        condition: service_healthy
    healthcheck: *spring-health

  sample-api:
    build: ./services/sample-api
    depends_on:
      employee-auth:
        condition: service_healthy
    healthcheck: *spring-health

  gateway:
    build: ./services/gateway
    environment:
      BACKOFFICE_ORIGIN: ${BACKOFFICE_ORIGIN}
    ports:
      - "8080:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      employee-auth:
        condition: service_healthy
      employee-service:
        condition: service_healthy
      sample-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s

  hr-backoffice:
    build:
      context: ./apps/hr-backoffice
      args:
        VITE_GATEWAY_URL: ${PUBLIC_BASE_URL}
    ports:
      - "3000:80"
    depends_on:
      - gateway

volumes:
  postgres-data:
